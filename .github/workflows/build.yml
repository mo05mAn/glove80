name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Glove80 combined firmware
        run: nix-build config -o combined
      - name: Copy firmware out of nix store
        run: cp combined/glove80.uf2 glove80.uf2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install keymap-drawer
        run: pip install keymap-drawer
      - name: Render keymap visualization
        run: |
          keymap parse -z config/glove80.keymap -o glove80.yaml
          keymap draw glove80.yaml -o glove80.svg
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: glove80-build
          path: |
            glove80.uf2
            glove80.svg
            glove80.yaml
